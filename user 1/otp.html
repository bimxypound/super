<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify Your Identity - OTP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #6366f1;        /* indigo-500 */
      --primary-dark: #4f46e5;
      --primary-light: #818cf8;
      --bg: #f8fafc;
      --card: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --error: #ef4444;
      --success: #10b981;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.08);
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 28px 32px;
      text-align: center;
    }

    .header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .header p {
      font-size: 0.95rem;
      opacity: 0.9;
    }

    .content {
      padding: 32px;
    }

    .info-text {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      text-align: center;
      margin-bottom: 28px;
    }

    .info-text strong {
      color: var(--text);
    }

    .otp-container {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin: 32px 0 40px;
    }

    .otp-input {
      width: 56px;
      height: 64px;
      text-align: center;
      font-size: 1.75rem;
      font-weight: 600;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
      transition: all 0.2s;
      color: var(--text);
    }

    .otp-input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
      background: white;
    }

    .otp-input::-webkit-inner-spin-button,
    .otp-input::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }

    .error-message {
      color: var(--error);
      font-size: 0.875rem;
      text-align: center;
      margin: 12px 0 20px;
      min-height: 1.2em;
    }

    .btn {
      width: 100%;
      padding: 14px;
      font-size: 1rem;
      font-weight: 600;
      color: white;
      background: var(--primary);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s;
      margin-top: 8px;
    }

    .btn:hover {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }

    .btn:disabled {
      background: #cbd5e1;
      cursor: not-allowed;
      transform: none;
    }

    .resend {
      text-align: center;
      margin-top: 28px;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .resend a {
      color: var(--primary);
      font-weight: 500;
      text-decoration: none;
    }

    .resend a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .container {
        border-radius: 0;
        box-shadow: none;
        border: none;
        min-height: 100vh;
      }
      
      .content {
        padding: 24px;
      }
      
      .otp-input {
        width: 50px;
        height: 60px;
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Verify Your Identity</h1>
    <p>One more step to keep your account secure</p>
  </div>

  <div class="content">
    <div class="info-text">
      We sent a 6-digit code to your email/phone<br>
      <strong>Enter the code below</strong>
    </div>

    <form id="otpForm">
      <div class="otp-container">
        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" autocomplete="one-time-code" required autofocus>
        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" required>
        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" required>
        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" required>
        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" required>
        <input type="text" class="otp-input" maxlength="1" pattern="[0-9]*" inputmode="numeric" required>
      </div>

      <div class="error-message" id="errorMsg"></div>

      <button type="submit" class="btn" id="verifyBtn" disabled>Verify & Continue</button>
    </form>

    <div class="resend">
      Didn't receive the code? <a href="#" id="resendLink">Resend</a>
      <br><span id="countdown" style="display:none;">You can resend in <b>60</b>s</span>
    </div>
  </div>
</div>

<script>
  const inputs = document.querySelectorAll('.otp-input');
  const form = document.getElementById('otpForm');
  const errorMsg = document.getElementById('errorMsg');
  const verifyBtn = document.getElementById('verifyBtn');
  const resendLink = document.getElementById('resendLink');
  const countdownEl = document.getElementById('countdown');

  // Auto-focus & move to next input
  inputs.forEach((input, index) => {
    input.addEventListener('input', (e) => {
      if (e.target.value && index < inputs.length - 1) {
        inputs[index + 1].focus();
      }
      checkIfAllFilled();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Backspace' && !e.target.value && index > 0) {
        inputs[index - 1].focus();
      }
    });

    // Paste handling
    input.addEventListener('paste', (e) => {
      e.preventDefault();
      const pasted = (e.clipboardData || window.clipboardData).getData('text');
      const digits = pasted.replace(/\D/g, '').slice(0, 6);
      
      if (digits.length > 0) {
        digits.split('').forEach((digit, i) => {
          if (index + i < inputs.length) {
            inputs[index + i].value = digit;
          }
        });
        const nextFocus = Math.min(index + digits.length, inputs.length - 1);
        inputs[nextFocus].focus();
        checkIfAllFilled();
      }
    });
  });

  function checkIfAllFilled() {
    const allFilled = Array.from(inputs).every(input => input.value.length === 1);
    verifyBtn.disabled = !allFilled;
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    
    const otp = Array.from(inputs).map(i => i.value).join('');
    
    // For demo: hardcoded OTP = 147128
    if (otp === '147128') {
      errorMsg.style.color = 'var(--success)';
      errorMsg.textContent = 'Verification successful! Redirecting...';
      verifyBtn.textContent = 'Verified ✓';
      verifyBtn.disabled = true;
      
      // In real app → window.location = "/dashboard" or next page
      setTimeout(() => {
         window.location.href = "/verify.html";
      }, 1200);
    } else {
      errorMsg.textContent = 'Incorrect code. Please try again.';
      inputs.forEach(i => i.value = '');
      inputs[0].focus();
      verifyBtn.disabled = true;
    }
  });

  // Resend simulation
  resendLink.addEventListener('click', (e) => {
    e.preventDefault();
    if (resendLink.style.pointerEvents === 'none') return;
    
    resendLink.style.pointerEvents = 'none';
    resendLink.textContent = 'Sending...';
    
    setTimeout(() => {
      alert("New OTP sent! (demo: still 147128)");
      startCountdown();
    }, 800);
  });

  function startCountdown() {
    let time = 60;
    countdownEl.style.display = 'block';
    resendLink.style.opacity = '0.5';
    
    const timer = setInterval(() => {
      time--;
      countdownEl.querySelector('b').textContent = time;
      if (time <= 0) {
        clearInterval(timer);
        countdownEl.style.display = 'none';
        resendLink.style.opacity = '1';
        resendLink.style.pointerEvents = 'auto';
        resendLink.textContent = 'Resend';
      }
    }, 1000);
  }
</script>

</body>
</html>
